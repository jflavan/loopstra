name: release

# Publishes every green push to main that changes what the package ships (src/, templates/,
# package.json) to npm, tags it v<version> and creates a GitHub Release. A manual run of this
# workflow on main releases even without such a change; `bump` forces a patch or minor release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a patch or minor release (empty: worked out from the commits)"
        required: false
        type: choice
        options: ["", patch, minor]

permissions:
  contents: write # push the tag and create the release
  id-token: write # npm trusted publishing (OIDC) and provenance

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # After ci succeeded on a push to main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit and tag: the version, the skip check and shipped.json need them
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
        # $BUMP unquoted: empty (a workflow_run, or no bump chosen) passes no argument.
        run: bun scripts/release.ts plan $BUMP >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.ship != 'true'
        run: echo "Nothing to release since v${{ steps.plan.outputs.previous }}."
      - if: steps.plan.outputs.ship == 'true'
        run: npm version "${{ steps.plan.outputs.version }}" --no-git-tag-version
      - if: steps.plan.outputs.ship == 'true'
        run: bun scripts/shipped.ts shipped.json
      - if: steps.plan.outputs.ship == 'true'
        run: npm publish --provenance --access public
      - if: steps.plan.outputs.ship == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          if [ -n "$PREVIOUS" ]; then range="v$PREVIOUS..v$VERSION"; else range="v$VERSION"; fi
          git log --format='- %s' --no-merges "$range" > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
