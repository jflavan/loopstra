name: release

# Stages every green push to main that changes what the package ships (src/, templates/,
# package.json) on npm, tags it v<version> and creates a GitHub Release. A staged version is not
# installable until a maintainer approves it with 2FA (docs/publishing.md says how): the trusted
# publisher on npm may stage but not publish. A manual run of this workflow on main releases even
# without such a change; `bump` forces a patch or minor release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a patch or minor release (empty: worked out from the commits)"
        required: false
        type: choice
        options: ["", patch, minor]

permissions:
  contents: write # push the tag and create the release
  id-token: write # npm trusted publishing (OIDC) and provenance

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # After ci succeeded on a push to main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # every commit and tag: the version, the skip check and shipped.json need them
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later, and `npm stage` 11.15 or later.
      - run: npm install -g npm@^11.21.0
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
        # Unquoted: an empty one (a workflow_run, or no bump chosen) passes no argument.
        run: bun scripts/release.ts plan $MANUAL $BUMP >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.ship != 'true'
        run: echo "Nothing to release since v${{ steps.plan.outputs.previous }}."
      - if: steps.plan.outputs.ship == 'true'
        run: npm version "${{ steps.plan.outputs.version }}" --no-git-tag-version
      - if: steps.plan.outputs.ship == 'true'
        run: bun scripts/shipped.ts shipped.json
      # Each of the last three steps tolerates having been done already, so a run that failed half way
      # (or a first release published by hand) can be run again. One exception: npm refuses to stage a
      # version that is already staged and not yet approved. Approve or reject that one first.
      - if: steps.plan.outputs.ship == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if npm view "loopstra@$VERSION" version >/dev/null 2>&1; then
            echo "loopstra@$VERSION is already published."
          else
            # Staged, not published: nobody can install it until a maintainer approves it.
            npm stage publish --provenance --access public
            {
              echo "## loopstra@$VERSION is staged on npm"
              echo
              echo "It is not installable until a maintainer approves it with 2FA, once npm's malware"
              echo "scan has finished (it shows as validating until then):"
              echo "on npmjs.com (the loopstra package, its staged versions), or, with npm 11.15 or later"
              echo "(or \`npx npm@11\`), \`npm stage list loopstra\`, then \`npm stage approve <stage-id> --auth-type=web\`."
              echo "See docs/publishing.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.plan.outputs.ship == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if tagged=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}"); then
            if [ "$tagged" != "$(git rev-parse HEAD)" ]; then echo "v$VERSION already tags another commit." >&2; exit 1; fi
            echo "v$VERSION is already tagged."
          else
            git tag "v$VERSION"
          fi
          git push origin "refs/tags/v$VERSION"
      - if: steps.plan.outputs.ship == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "The release v$VERSION exists already."
            exit 0
          fi
          if [ -n "$PREVIOUS" ]; then range="v$PREVIOUS..v$VERSION"; else range="v$VERSION"; fi
          git log --format='- %s' --no-merges "$range" > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
