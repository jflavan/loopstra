name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.part && format(', part {0}', matrix.part) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # Windows runs the suite many times slower (process starts and file churn), so it is split
          # over three runners; each takes a third of the files, balanced by weight (scripts/test.ts).
          - { os: windows-latest, part: 1/3 }
          - { os: windows-latest, part: 2/3 }
          - { os: windows-latest, part: 3/3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Git identity for the tests' throwaway repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: "Windows: no Defender scanning of the checkout and temp, and temp on the work disk"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}", "$env:TEMP", "$env:USERPROFILE\.bun"
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run deadcode
      - run: bun run test ${{ matrix.part && format('--part {0}', matrix.part) || '' }}

  coverage:
    name: coverage (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Git identity for the tests' throwaway repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: bun install --frozen-lockfile
      # scripts/coverage.ts fails when total line or function coverage is under 80%.
      - run: bun run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
