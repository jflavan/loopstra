name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.part && format(', part {0}', matrix.part) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # Windows runs the suite many times slower (process starts and file churn), so it is split
          # over three runners; each takes a third of the files, balanced by weight (scripts/test.ts).
          - { os: windows-latest, part: 1/3 }
          - { os: windows-latest, part: 2/3 }
          - { os: windows-latest, part: 3/3 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Git identity for the tests' throwaway repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: "Windows: no Defender scanning of the checkout and temp, and temp on the work disk"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}", "$env:TEMP", "$env:USERPROFILE\.bun"
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test ${{ matrix.part && format('--part {0}', matrix.part) || '' }}
