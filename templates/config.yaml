# Loopstra configuration. Engineers edit this; product owners never need to.
# Every key except commands.test has a default (spending limits default to none). Unknown keys are errors.
# Changes take effect on the next pass of the loop; no restart needed.
# `loopstra setup` walks through these settings and keeps this file's comments.
version: 1
main_branch: __MAIN_BRANCH__
poll_seconds: 60

commands:
__COMMANDS__

claude:
  models:
    default: sonnet
    cheap: haiku
    strong: opus
    max: fable # aliases follow Claude Code's newest model; a full name (claude-opus-5-5) pins one
  # What a build session may do without asking. The commands above (test, lint, build, run, install)
  # are always added. Git stays read-only: Loopstra makes every commit itself. The default:
  # allowed_tools: [Read, Edit, Write, Glob, Grep, "Bash(bun *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)", "Bash(git status *)"]
  # Spending limits, in US dollars, are off unless set (`loopstra setup budgets` sets them in minutes or dollars):
  #   max_budget_usd: what one session may spend
  #   max_budget_usd_per_day: what the loop's sessions may spend together in a day
  timeout_minutes: 30

# Gates between stages. human: status (a person edits the status line) | none; the merge gate also
# takes pr (approval of its GitHub pull request). agent: true runs an independent reviewer with a fresh context.
# A person always accepts an intent (draft -> accepted); by default everything after runs on its own.
gates:
  spec: { human: none, agent: true }
  plan: { human: none, agent: true }
  merge: { human: none, method: squash }
  done: { human: none, agent: true }

# Per-stage model, skills to load, and deterministic commands to run before and after.
# A step of a stage can have its own model too, for example under a stage:
#   steps: { done-check: max }  # a step's own model; see the step table in the README
stages:
  design: { model: strong, skills: [], before: [], after: [] }
  plan: { model: strong, skills: [], before: [], after: [] }
  build: { model: default, skills: [], before: [], after: [], max_fix_loops: 3 }
  review: { model: strong, skills: [], before: [], after: [], max_rounds: 2 }
  verify: { model: default, skills: [], before: [], after: [] }

# Work that runs at the same time to save waiting. Only cheap_judges: first changes who decides:
# once earned, a cheaper judge's pass stands.
# parallel_checks: test, lint and build start together (leave off if they write the same folder).
# overlap_judges: the first review runs alongside the verifier, and lessons alongside the final
# check. When the verifier fails, that review is stopped at once and runs again after the fix.
# plan_ahead: the first plan is written while the spec is being checked; it is stopped if the spec
# does not pass, and used only if the code on main it read has not changed (sessions read main's last
# commit, so uncommitted edits in the main checkout never count).
# cheap_judges: off | shadow | first. A cheaper judge (claude.models.default) for the spec check,
# the plan challenge and the review. shadow: it judges alongside the strong one on the same question
# and only the strong one decides; `loopstra judges` shows how often they agreed. first: once the
# cheaper judge has also rejected the last 30 things the strong one rejected, it judges alone and a
# pass stands; anything it rejects or is unsure of goes to the strong judge, and every 5th call runs
# both as an audit. Until then, first runs as shadow. shadow and audits need room in the day's
# budget for both sessions (three beside the verifier or a plan written ahead), so never with
# max_budget_usd_per_day and no max_budget_usd; then the strong judge decides alone.
# think_ahead: design and plan steps also run, one at a time, beside the changes running a step,
# so a change accepted during another's build is designed and planned by the time the build ends.
# Their sessions only read code and run none of the project's commands, so they need no room on
# this machine, only in the budget. A design or plan stage with before or after commands is left
# to max_parallel_changes.
# max_parallel_changes: how many changes may each run a step at the same time (1 to 4). Raise it
# only if the project's commands (test, lint, build, install) can run twice at once on this
# machine: no fixed ports, no shared test database, no output outside the worktree. Each command
# gets LOOPSTRA_SLUG and LOOPSTRA_SLOT (0, 1, ...: no two changes running at once share one), so it
# can pick its own ports, database and Docker project names. More changes at once also
# spend the daily budget and the subscription's usage limits faster.
speed:
  parallel_checks: false
  overlap_judges: true
  plan_ahead: true
  cheap_judges: off
  think_ahead: true
  max_parallel_changes: 1

signals:
  main_health: { every_minutes: 30 }

# Chat: `loopstra chat` (terminal, plus any bots) and the drawer in `loopstra ui` (the console). The orchestrator
# answers questions and works out new changes with you; agreed ones are written up as draft intents
# (through a pull request when there is a remote). It is read-only, except that someone on a bot's
# acceptors list (or at the terminal or the console) can have a change written up and start a draft.
# `loopstra setup chat` adds Slack or Discord bots under transports, for example:
#   transports:
#     slack:                     # Socket Mode; tokens are read from these environment variables
#       token_env: LOOPSTRA_SLACK_APP_TOKEN
#       bot_token_env: LOOPSTRA_SLACK_BOT_TOKEN
#       channel: C0123ABCD       # each top-level message starts a conversation in its thread
#       allow: [U01AAA, U01BBB]  # who may chat; empty means anyone in the channel
#       acceptors: [U01AAA]      # who may also have changes written up and start drafts; empty means nobody from Slack
#       announce_to: C0123ABCD   # where blocked / waiting / merged changes are announced
#     discord:                   # gateway bot with the Message Content intent on
#       token_env: LOOPSTRA_DISCORD_TOKEN
#       channel: "1234567890"
#       allow: []
#       acceptors: []
#       announce_to: "1234567890"
# Spending limits (off unless set): max_budget_usd_per_day for chat turns and write-ups together,
# max_budget_usd_per_session for what one of them may hold of it, so others can run meanwhile.
chat:
  model: default # the orchestrator; write-intent: chat.steps (default: stages.design.model)
